# XcodeGen 项目定义 —— 生成 TrollAutoTouch.xcodeproj
# 用法:  安装 xcodegen (brew install xcodegen) 后，在本目录执行 `xcodegen generate`
name: TrollAutoTouch
options:
  bundleIdPrefix: com.trollautotouch
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: ""
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CLANG_ENABLE_MODULES: NO
    # 禁用显式模块，避免 iOS SDK 中私有/非模块化头文件导致的编译错误
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_BITCODE: NO
    # CLANG_ENABLE_MODULES=NO 时需显式链接所有使用到的框架
    # -Wl,-undefined,dynamic_lookup: 进程内 HUD 宿主的私有符号
    # (SBSAccessibilityWindowHostingController 等) 运行时由 dyld 动态解析
    # (不产生私有框架链接依赖)。
    # 注意: 必须保持 chained fixups 启用（不要加 -Wl,-no_fixup_chains /
    #       ENABLE_CHAINED_FIXUPS=NO）！iOS 16+ 的 dyld 对 arm64e 架构强制要求
    #       LC_DYLD_CHAINED_FIXUPS，禁用它会导致 iOS 16 设备启动即闪退
    #       (dyld: missing chained fixups)。CI 已用 Procursus ldid
    #       (v2.1.5-procursus7) 签名，支持 chained fixups 重签。
    # 注意: 只能写在这里，不能在 xcodebuild 命令行里传 OTHER_LDFLAGS，
    #       否则会整体覆盖掉这里的框架链接参数导致链接失败。
    OTHER_LDFLAGS: -framework UIKit -framework CoreGraphics -framework QuartzCore -framework CoreImage -framework Security -framework WebKit -framework NetworkExtension -framework SystemConfiguration -framework CoreLocation -weak_framework IOKit -weak_framework Vision -weak_framework AVFoundation -weak_framework AudioToolbox -weak_framework MediaPlayer -weak_framework UserNotifications -Wl,-undefined,dynamic_lookup -lz
targets:
  TrollAutoTouch:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: TrollAutoTouch
        excludes:
          - "SceneDelegate.*"
          - "Resources/demo.script"
          - "Resources/demo.lua"
          - "Resources/lua/**"
          # www 网页资源 (noVNC + 脚本设置 UI) 由 build-ipa.sh 打包时
          # 整目录拷贝进 app bundle, 不走 xcodegen (避免多个 index.html
          # 因 basename 相同在 Copy Bundle Resources 里冲突)。
          - "Resources/www/**"
          # vendor/lua 由下方独立条目管理（需排除 lua.c/luac.c 两个含 main 的程序源）。
          # 若不排除，本递归条目会把它们一并收录，与 AppDelegate 的 main 冲突
          # 导致链接期 duplicate symbol '_main'。
          - "vendor/lua/**"
      - path: TrollAutoTouch/vendor/lua
        excludes:
          - "lua.c"    # 独立解释器程序, 不需要编译进 App
          - "luac.c"   # 独立编译器程序, 不需要编译进 App
        # LUA_USE_IOS: Lua 官方 iOS 构建宏（等价官方 Makefile 的 ios target）。
        # 使 loslib.c 不调用 iOS SDK 标记为 unavailable 的 system()，
        # 并在 luaconf.h 中启用 LUA_USE_POSIX/LUA_USE_DLOPEN（iOS 均支持）。
        compilerFlags: "-DLUA_USE_IOS"
        # 头文件搜索路径: 使 TSLuaBridge.m 能 #import "lua.h"
        headerVisibility: public
        createIntermediateGroups: true
    resources:
      - path: TrollAutoTouch/Resources/demo.script
      - path: TrollAutoTouch/Resources/demo.lua
      - path: TrollAutoTouch/Assets.xcassets
        optional: true
      - path: TrollAutoTouch/Resources/lua
        optional: true
      # 注: www 网页资源 (noVNC + www/ui/* 脚本设置 UI) 不走 xcodegen 打包,
      # 由 build-ipa.sh 在组装 Payload 时整目录拷贝到 TrollAutoTouch.app/www/,
      # 避免多个 index.html 因 basename 相同在 Copy Bundle Resources 冲突。
      - path: TrollAutoTouch/Resources/lib
        optional: true
      - path: TrollAutoTouch/Resources/res
        optional: true
    info:
      path: TrollAutoTouch/Info.plist
      properties:
        CFBundleDisplayName: QQ音乐
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        # 后台保活(2026-08-28 二轮实测修正 + 逆向 AutoGoRunner app-release.ipa 确认):
        # 用户实测: 仅 audio 静音播放 + URLSession 认证挂起时, iOS 16.x 上
        # AVPlayer静音=1 且 backgroundTimeRemaining 剩余-1秒, 后台约10秒后仍被系统强杀
        # (整个进程消失, 端口全断)。逆向 AutoGoRunner 的 Info.plist / entitlements 确认
        # 其保活真实组合:
        #   (1) 主通道: UIBackgroundModes 声明 location + CLLocationManager 持续
        #       startUpdatingLocation —— 导航类机制, 苹果官方认可后台无限运行,
        #       不需要 platform 身份, TrollStore(iOS 15.5+)下可用。
        #       由 TSLocationKeepAlive 实现; entitlements 已含 com.apple.private.tcc.allow
        #       的 kTCCServiceLocation 预授权 + locationd 全套权限, 授权自动为
        #       "始终允许", 无需用户弹窗。
        #   (2) audio + AVAudioPlayer 全零静音 WAV(volume=0.0): 辅助。已被 iOS 16
        #       静音审计判定为无声播放, 不提供持续后台(实测无效), 保留作无定位场景兜底。
        #   (3) NEHotspotHelper(network-authentication): TSNetworkAuth 注册,
        #       受限 entitlement, TrollStore 下大概率注册失败, 仅作辅助。
        #   (4) background URLSession + downloadTask 认证挑战挂起: TSAuthKeepAlive,
        #       辅助兜底(系统按需唤醒, 非持续后台)。
        # AutoGoRunner 的 platform-application / no-sandbox / kernel.jetsam /
        # memorystatus / runningboard.terminateprocess / multitasking.termination /
        # SBAppIsDaemon 等特权 entitlements 我们已全部对齐, 但 TrollStore 在
        # iOS 15.5+ 不授予 CS_PLATFORM_BINARY(platform 身份), 这些特权实际不生效;
        # location 保活不需要它们。
        # 注意: 声明 voip 但 PushKit 注册失败(iOS 16 强制检查, TrollStore 下
        # aps-environment 无有效凭证必然失败)启动即闪退 —— 已删除全部 PushKit,
        # 也不声明 voip 后台模式。
        UIBackgroundModes:
          - audio
          - network-authentication
          - location
        # 对齐原版 TrollAutoScript 2.3.6: HideAtLaunch=true —— SpringBoard 私有键,
        # 让 app 在 App Switcher 中不显示(隐藏型应用), 后台挂起/切换器策略区别于普通 app。
        # 实测(2026-08-28): 原版带此键在 iOS 16.6 后台保活正常, 我们此前未对齐, 补上。
        HideAtLaunch: true
        # 进入后台后不挂起(防止被 SpringBoard 立即冻结)
        UIApplicationExitsOnSuspend: false
        # 脚本网页设置 UI (WKWebView) 通过 http://127.0.0.1 访问内嵌 HTTP 服务器,
        # 需要 ATS 本地网络豁免 (NSAllowsLocalNetworking, iOS 10+)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon60x60
              - AppIcon40x40
              - AppIcon29x29
            UIPrerenderedIcon: false
        CFBundleIcons~ipad:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon76x76
              - AppIcon40x40
              - AppIcon29x29
            UIPrerenderedIcon: false
    entitlements:
      path: TrollAutoTouch/TrollAutoTouch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tencent.QQMusic
        PRODUCT_NAME: TrollAutoTouch
        # 让 dyld 在主二进制内解析私有框架符号
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks /System/Library/PrivateFrameworks"
        # Lua 5.4 头文件搜索路径
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/TrollAutoTouch/vendor/lua"
        # Lua 编译为标准 C99，禁用自动 ARC(纯 C 无影响但更稳)
        GCC_C_LANGUAGE_STANDARD: gnu99
  # ─────────────────────────────────────────────────────────────────────────────
  # 注意: 旧版 HUDServices 独立 app (双 App tipa) 已废弃移除。
  # HUD 全局弹窗现在由主 App 进程内完成 (TSHUDHost + SBSAccessibilityWindowHostingController),
  # 不再需要独立 target / CPDistributedMessagingCenter / TrollStore 多 app 安装。
  # 桌面只显示 TrollAutoTouch 一个图标。
  # ─────────────────────────────────────────────────────────────────────────────
