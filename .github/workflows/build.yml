name: Build TrollAutoTouch IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install xcodegen
          mkdir -p $HOME/.local/bin
          curl -fsSL -o $HOME/.local/bin/ldid \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
          chmod +x $HOME/.local/bin/ldid
          xattr -cr $HOME/.local/bin/ldid 2>/dev/null || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "[*] ldid simple test:"
          ldid 2>&1 || true
          file $HOME/.local/bin/ldid

      - name: Generate Xcode project
        run: |
          rm -rf TrollAutoTouch.xcodeproj
          xcodegen generate

      - name: Build
        run: |
          mkdir -p build
          set -e
          xcodebuild -project TrollAutoTouch.xcodeproj \
            -scheme TrollAutoTouch \
            -configuration Release \
            -sdk iphoneos \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            STRIP_INSTALLED_PRODUCT=NO \
            DEAD_CODE_STRIPPING=NO \
            -derivedDataPath build/DerivedData \
            build 2>&1 | tail -20

      - name: Package IPA
        run: |
          set -e
          APP=$(find build/DerivedData -name 'TrollAutoTouch.app' -type d | head -1)
          [ -z "$APP" ] && echo "[-] .app not found" && exit 1
          echo "[*] .app: $APP"

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          APP_DST="build/Payload/TrollAutoTouch.app"
          BIN="$APP_DST/TrollAutoTouch"

          # ======== 0: 架构诊断 ========
          echo ""
          echo "=== 架构诊断 ==="
          echo "[*] lipo -info:"
          lipo -info "$BIN"
          echo "[*] file:"
          file "$BIN"
          echo "[*] codesign -dv (签名状态):"
          codesign -dvvv "$BIN" 2>&1 || echo "  (无签名)"

          # ======== 1: 清理签名 ========
          echo ""
          echo "=== 清理签名 ==="
          if [ -d "$APP_DST/_CodeSignature" ]; then
            echo "[*] 删除 _CodeSignature/"
            rm -rf "$APP_DST/_CodeSignature"
          else
            echo "[*] 无 _CodeSignature"
          fi
          # 不在这里用 codesign --remove-signature，先让 ldid 自己处理

          # ======== 2: 图标 ========
          echo ""
          echo "=== 图标 ==="
          # 删除 xcodebuild 可能带进来的旧 AppIcon.png
          rm -f "$APP_DST/AppIcon.png" "$APP_DST/icon-1024.ico"
          ICONSET="TrollAutoTouch/Assets.xcassets/AppIcon.appiconset"
          if ls "$ICONSET"/*.png 1>/dev/null 2>&1; then
            cp "$ICONSET"/*.png "$APP_DST/"
            echo "[OK] 拷贝图标:"
            ls "$ICONSET"/*.png | while read f; do echo "    $(basename $f)"; done
          fi

          # ======== 3: ldid 测试 - 先试最小 entitlements ========
          echo ""
          echo "=== ldid 调试 ==="
          echo "[*] ldid 可执行文件检查:"
          file $(which ldid)
          echo ""

          # 创建最小 entitlements（只两个关键权限），排除其他权限干扰
          MINENT=$(mktemp -t min_entitlements)
          cat > "$MINENT" << 'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>platform-application</key>
              <true/>
              <key>com.apple.private.security.no-sandbox</key>
              <true/>
          </dict>
          </plist>
          PLISTEOF
          echo "[*] 最小 entitlements 内容:"
          cat "$MINENT"

          echo ""
          echo "[>] 测试: ldid -S(minimal) $BIN"
          ldid -S"$MINENT" "$BIN"
          echo "[<] 返回码: $?"
          echo "[*] ldid -e (最小 entitlements):"
          ldid -e "$BIN"

          # ======== 如果最小 entitlements 成功，再试完整版 ========
          echo ""
          echo "[>] 测试: ldid -S(full) $BIN"
          ldid -S"TrollAutoTouch/TrollAutoTouch.entitlements" "$BIN"
          echo "[<] 返回码: $?"
          echo "[*] ldid -e (完整 entitlements):"
          ldid -e "$BIN"
          echo ""
          echo "(看上面是否有 no-sandbox 和 platform-application)"

          # ======== 最后检查 Info.plist ========
          echo ""
          echo "=== Info.plist CFBundleIcons ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$APP_DST/Info.plist" 2>/dev/null || echo "(无 CFBundleIcons)"

          echo ""
          echo "=== .app 根目录 PNG ==="
          find "$APP_DST" -maxdepth 1 -name "*.png" -exec basename {} \;

          # ======== 打包 ========
          cd build && zip -qry TrollAutoTouch.ipa Payload
          echo "[OK] build/TrollAutoTouch.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollAutoTouch
          path: build/TrollAutoTouch.ipa
          if-no-files-found: error