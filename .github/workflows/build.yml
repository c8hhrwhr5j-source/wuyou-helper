name: Build TrollAutoTouch IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install ldid xcodegen
          ldid 2>&1 | head -2 || true

      - name: Generate Xcode project
        run: |
          rm -rf TrollAutoTouch.xcodeproj
          xcodegen generate

      - name: Build
        run: |
          mkdir -p build
          set -e
          xcodebuild -project TrollAutoTouch.xcodeproj \
            -scheme TrollAutoTouch \
            -configuration Release \
            -sdk iphoneos \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            STRIP_INSTALLED_PRODUCT=NO \
            DEAD_CODE_STRIPPING=NO \
            -derivedDataPath build/DerivedData \
            build 2>&1 | tail -20

      - name: Package IPA
        run: |
          set -e
          APP=$(find build/DerivedData -name 'TrollAutoTouch.app' -type d | head -1)
          [ -z "$APP" ] && echo "[-] .app not found" && exit 1
          echo "[*] .app: $APP"

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          APP_DST="build/Payload/TrollAutoTouch.app"
          BIN="$APP_DST/TrollAutoTouch"
          ENT="$PWD/TrollAutoTouch/TrollAutoTouch.entitlements"

          # ======== 架构诊断 ========
          echo ""
          echo "=== 架构 ==="
          lipo -info "$BIN"
          file "$BIN"

          # ======== 清理旧签名 ========
          echo ""
          echo "=== 清理签名 ==="
          rm -rf "$APP_DST/_CodeSignature"
          codesign --remove-signature "$BIN" 2>/dev/null && echo "[OK] 签名已移除" || echo "[*] 二进制无签名"

          # ======== 图标 ========
          echo ""
          echo "=== 图标 ==="
          rm -f "$APP_DST/AppIcon.png" "$APP_DST/icon-1024.ico"
          ICONSET="$PWD/TrollAutoTouch/Assets.xcassets/AppIcon.appiconset"
          ls "$ICONSET"/*.png 1>/dev/null 2>&1 && cp "$ICONSET"/*.png "$APP_DST/" && echo "[OK]" || echo "[!] no icons"

          # ======== 策略 A: codesign 嵌入 entitlements + ldid 假签 ========
          echo ""
          echo "=== 策略A: codesign(嵌入entitlements) -> ldid(假签) ==="
          codesign -s - -f --entitlements "$ENT" "$BIN" 2>&1
          echo "[codesign 返回: $?]"
          
          echo ""
          echo "[验证] codesign --entitlements:"
          codesign -d --entitlements - "$BIN" 2>&1 | grep -A5 "<?xml" || echo "(无)"

          echo ""
          echo "[>] ldid -S (假签覆盖, 应该保留 entitlements)"
          ldid -S "$BIN"
          echo "[ldid 返回: $?]"

          echo ""
          echo "[验证] ldid -e (假签后):"
          ldid -e "$BIN"
          
          echo ""
          echo "[验证] codesign --entitlements (假签后):"
          codesign -d --entitlements - "$BIN" 2>&1 | grep -A5 "<?xml" || echo "(无)"

          # ======== 策略 B: 直接 ldid 两步（如果 A 不行） ========
          echo ""
          echo "=== 策略B: ldid两步 (先空签, 再注entitlements) ==="
          codesign --remove-signature "$BIN" 2>/dev/null || true
          echo "[>] ldid -S (空签)"
          ldid -S "$BIN"
          echo "[>] ldid -S(entitlements)"
          ldid -S"$ENT" "$BIN"
          echo "[验证] ldid -e:"
          ldid -e "$BIN"

          # ======== Info.plist ========
          echo ""
          echo "=== Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles" "$APP_DST/Info.plist" 2>/dev/null || echo "(无 CFBundleIcons)"
          
          echo ""
          echo "=== .app PNG ==="
          find "$APP_DST" -maxdepth 1 -name "*.png" | while read f; do echo "  $(basename $f) ($(stat -f%z "$f") bytes)"; done

          # ======== 打包 ========
          cd build && zip -qry TrollAutoTouch.ipa Payload
          echo "[OK] build/TrollAutoTouch.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollAutoTouch
          path: build/TrollAutoTouch.ipa
          if-no-files-found: error
