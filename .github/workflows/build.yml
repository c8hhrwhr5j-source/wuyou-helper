name: Build TrollAutoTouch IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install xcodegen ldid
          gem install xcpretty 2>/dev/null || true

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Build with xcodebuild
        id: build_step
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild -project TrollAutoTouch.xcodeproj \
            -scheme TrollAutoTouch \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build/DerivedData \
            build 2>&1 | tee build/build.log
        continue-on-error: true

      - name: Show first error detail
        if: steps.build_step.outcome == 'failure'
        run: |
          echo "=== ERROR LINES ==="
          grep -nE ': (error|fatal error):|error:' build/build.log | head -20 || true
          echo "=== LAST 30 ERROR LINES (grep -A1) ==="
          grep -A1 ': error:' build/build.log | head -60 || true

      - name: Fail if build failed
        if: steps.build_step.outcome == 'failure'
        run: |
          echo "Build failed!"
          exit 1

      - name: Package IPA
        run: |
          APP=$(find build/DerivedData -name 'TrollAutoTouch.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "[-] TrollAutoTouch.app not found"
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          ldid -S"TrollAutoTouch/TrollAutoTouch.entitlements" "build/Payload/TrollAutoTouch.app/TrollAutoTouch"
          cd build && zip -qry TrollAutoTouch.ipa Payload
          echo "[OK] build/TrollAutoTouch.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollAutoTouch
          path: build/TrollAutoTouch.ipa
          if-no-files-found: error
