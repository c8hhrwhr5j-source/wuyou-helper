name: Build TrollAutoTouch IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install ldid xcodegen
          ldid 2>&1 | head -2 || true

      - name: Generate Xcode project
        run: |
          rm -rf TrollAutoTouch.xcodeproj
          xcodegen generate

      - name: Build
        run: |
          mkdir -p build
          set -e
          xcodebuild -project TrollAutoTouch.xcodeproj \
            -scheme TrollAutoTouch \
            -configuration Release \
            -sdk iphoneos \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            STRIP_INSTALLED_PRODUCT=NO \
            DEAD_CODE_STRIPPING=NO \
            -derivedDataPath build/DerivedData \
            build 2>&1 | tail -20

      - name: Package IPA
        run: |
          set -e
          APP=$(find build/DerivedData -name 'TrollAutoTouch.app' -type d | head -1)
          [ -z "$APP" ] && echo "[-] .app not found" && exit 1
          echo "[*] .app: $APP"

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          APP_DST="build/Payload/TrollAutoTouch.app"
          BIN="$APP_DST/TrollAutoTouch"
          ENT="$PWD/TrollAutoTouch/TrollAutoTouch.entitlements"

          echo ""
          echo "=== 架构 ==="
          lipo -info "$BIN"
          file "$BIN"

          echo ""
          echo "=== 清理旧签名 ==="
          rm -rf "$APP_DST/_CodeSignature"
          codesign --remove-signature "$BIN" 2>/dev/null && echo "[OK] 签名已移除" || echo "[*] 二进制无签名"

          echo ""
          echo "=== 图标 ==="
          rm -f "$APP_DST/AppIcon.png" "$APP_DST/icon-1024.ico"
          ICONSET="$PWD/TrollAutoTouch/Assets.xcassets/AppIcon.appiconset"
          ls "$ICONSET"/*.png 1>/dev/null 2>&1 && cp "$ICONSET"/*.png "$APP_DST/" && echo "[OK]" || echo "[!] no icons"

          echo ""
          echo "=== 注入 entitlements (ldid) ==="
          echo "[*] entitlements 文件: $ENT"
          test -f "$ENT" || { echo "[x] entitlements 文件不存在!"; exit 1; }
          # 先用 plutil 验证 plist 是否合法
          plutil -lint "$ENT" || { echo "[x] entitlements plist 非法, 停止打包"; exit 1; }
          echo "[>] ldid -S$ENT $BIN"
          ldid -S"$ENT" "$BIN" 2>&1 || { echo "[x] ldid 注入失败, 停止打包"; exit 1; }
          echo "[ldid 返回: $?]"

          echo ""
          echo "=== 验证注入结果 ==="
          EXTRACTED=$(ldid -e "$BIN" 2>/dev/null || true)
          echo "$EXTRACTED" > /tmp/ent_check.xml
          echo "[*] ldid -e 输出: $(wc -c < /tmp/ent_check.xml) bytes"
          MISSING=0
          for KEY in "com.apple.private.security.no-sandbox" "platform-application" "com.apple.private.tcc.allow" "keychain-access-groups" "com.apple.private.security.container-manager"; do
            if grep -q "$KEY" /tmp/ent_check.xml; then
              echo "[OK] $KEY"
            else
              echo "[x] 缺少: $KEY"
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then
            echo ""
            echo "[x] entitlements 注入验证失败, 停止打包"
            echo "[debug] ldid -e 前 60 行:"
            head -60 /tmp/ent_check.xml
            exit 1
          fi
          echo "[OK] entitlements 注入验证通过 (no-sandbox / platform-application / TCC / keychain / container 全部就位)"

          echo ""
          echo "=== Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles" "$APP_DST/Info.plist" 2>/dev/null || echo "(无 CFBundleIcons)"

          echo ""
          echo "=== .app PNG ==="
          find "$APP_DST" -maxdepth 1 -name "*.png" | while read f; do echo "  $(basename $f) ($(stat -f%z "$f") bytes)"; done

          echo ""
          echo "=== 打包 ==="
          cd build && zip -qry TrollAutoTouch.ipa Payload
          echo "[OK] build/TrollAutoTouch.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollAutoTouch
          path: build/TrollAutoTouch.ipa
          if-no-files-found: error
