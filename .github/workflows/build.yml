name: Build TrollAutoTouch IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install xcodegen
          # 不用 brew 提供的 ldid (在 macos-15 arm64 runner 上可能兼容有问题)
          # 直接下载 ProcursusTeam 提供的 macOS arm64 原生 ldid
          mkdir -p $HOME/.local/bin
          curl -fsSL -o $HOME/.local/bin/ldid \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
          chmod +x $HOME/.local/bin/ldid
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "[*] ldid version:"
          ldid 2>&1 | head -3 || true

      - name: Generate Xcode project
        run: |
          rm -rf TrollAutoTouch.xcodeproj
          xcodegen generate

      - name: Build
        run: |
          mkdir -p build
          set -e
          xcodebuild -project TrollAutoTouch.xcodeproj \
            -scheme TrollAutoTouch \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -arch arm64e \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            STRIP_INSTALLED_PRODUCT=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            DEAD_CODE_STRIPPING=NO \
            -derivedDataPath build/DerivedData \
            build 2>&1 | tee build/build.log

      - name: Package IPA
        run: |
          set -e
          APP=$(find build/DerivedData -name 'TrollAutoTouch.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "[-] TrollAutoTouch.app not found"
            exit 1
          fi
          echo "[*] 找到 .app: $APP"

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          APP_DST="build/Payload/TrollAutoTouch.app"
          BIN="$APP_DST/TrollAutoTouch"

          echo ""
          echo "========== 诊断: .app 内容 =========="
          echo "[*] Info.plist CFBundleIconFiles:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles" "$APP_DST/Info.plist" 2>/dev/null || echo "  (无 CFBundleIcons)"
          echo ""
          echo "[*] .app 根目录:"
          ls -la "$APP_DST/"
          echo ""

          echo "========== 第1步: 清理现有签名 =========="
          if [ -d "$APP_DST/_CodeSignature" ]; then
            echo "[*] 删除 _CodeSignature 目录"
            rm -rf "$APP_DST/_CodeSignature"
          fi
          # 强制移除二进制中的任何签名
          codesign --remove-signature "$BIN" 2>/dev/null || true
          echo "[OK] 清理完成"

          echo ""
          echo "========== 第2步: 拷贝图标 PNG 到 .app 根目录 =========="
          ICONSET="TrollAutoTouch/Assets.xcassets/AppIcon.appiconset"
          rm -f "$APP_DST"/*.png
          if ls "$ICONSET"/*.png 1>/dev/null 2>&1; then
            cp "$ICONSET"/*.png "$APP_DST/"
            echo "[OK] 拷贝了 $(ls $ICONSET/*.png | wc -l | tr -d ' ') 个 PNG:"
            ls "$ICONSET"/*.png | while read f; do echo "    $(basename $f) ($(stat -f%z "$f") bytes)"; done
          else
            echo "[!] 未找到图标 PNG，fallback 到 sips"
            SRC_ICON="TrollAutoTouch_icon.png"
            sips -z 120 120 "$SRC_ICON" --out "$APP_DST/AppIcon60x60@2x.png" >/dev/null
            sips -z 180 180 "$SRC_ICON" --out "$APP_DST/AppIcon60x60@3x.png" >/dev/null
          fi

          echo ""
          echo "========== 第3步: ldid 注入 entitlements =========="
          ENT="TrollAutoTouch/TrollAutoTouch.entitlements"
          echo "[*] 使用的 ldid 版本:"
          which ldid && ldid -h 2>&1 | head -3
          echo ""
          echo "[*] 执行 ldid -S$ENT $BIN"
          ldid -S"$ENT" "$BIN"
          echo "[OK] ldid 执行完成"

          echo ""
          echo "========== 第4步: 验证注入结果 =========="
          echo "[*] ldid -e 输出 (应该看到 no-sandbox 和 platform-application):"
          ldid -e "$BIN"
          echo ""

          echo "========== 第5步: 最终 IPA 内容 =========="
          echo "[*] .app 根目录 PNG:"
          find "$APP_DST" -maxdepth 1 -name "*.png" -exec basename {} \;

          cd build && zip -qry TrollAutoTouch.ipa Payload
          echo ""
          echo "[OK] build/TrollAutoTouch.ipa 生成成功"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollAutoTouch
          path: build/TrollAutoTouch.ipa
          if-no-files-found: error