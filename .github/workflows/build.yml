name: Build TrollAutoTouch IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: |
          rm -rf TrollAutoTouch.xcodeproj
          xcodegen generate

      - name: Build
        run: |
          mkdir -p build
          set +e
          xcodebuild -project TrollAutoTouch.xcodeproj \
            -scheme TrollAutoTouch \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build/DerivedData \
            build > build/build.log 2>&1
          BUILD_EXIT=$?
          cat build/build.log
          exit $BUILD_EXIT

      - name: Package IPA
        run: |
          APP=$(find build/DerivedData -name 'TrollAutoTouch.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "[-] TrollAutoTouch.app not found"
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          APP_DST="build/Payload/TrollAutoTouch.app"
          BIN="$APP_DST/TrollAutoTouch"

          echo "========== 诊断: .app 内容 =========="
          echo "[*] Info.plist CFBundleIconFiles:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles" "$APP_DST/Info.plist" 2>/dev/null || echo "  (读取失败)"
          echo ""
          echo "[*] .app 根目录所有文件 (前 50 行):"
          ls -la "$APP_DST/" | head -50
          echo ""
          echo "[*] 二进制文件类型:"
          file "$BIN"
          echo ""
          echo "[*] 二进制中是否已有签名:"
          codesign -d -v "$BIN" 2>&1 || echo "  (无签名/验证失败)"
          echo ""

          echo "========== 第1步: 清理现有签名 =========="
          # 删除 xcodebuild 可能遗留的 _CodeSignature 目录
          if [ -d "$APP_DST/_CodeSignature" ]; then
            echo "[*] 删除 _CodeSignature 目录"
            rm -rf "$APP_DST/_CodeSignature"
          else
            echo "[*] 无 _CodeSignature 目录"
          fi
          # 移除二进制中的 ad-hoc 签名 (如果存在)
          codesign --remove-signature "$BIN" 2>/dev/null && echo "[*] 已移除二进制签名" || echo "[*] 二进制无签名"

          echo ""
          echo "========== 第2步: 拷贝图标 PNG =========="
          ICONSET="TrollAutoTouch/Assets.xcassets/AppIcon.appiconset"
          if ls "$ICONSET"/*.png 1>/dev/null 2>&1; then
            cp "$ICONSET"/*.png "$APP_DST/"
            echo "[*] 已拷贝图标:"
            ls "$ICONSET"/*.png | while read f; do echo "    $(basename $f)"; done
          else
            echo "[!] 未找到图标 PNG，用 sips 生成..."
            SRC_ICON="TrollAutoTouch_icon.png"
            if [ -f "$SRC_ICON" ]; then
              sips -z 120 120 "$SRC_ICON" --out "$APP_DST/AppIcon60x60@2x.png" >/dev/null 2>&1
              sips -z 180 180 "$SRC_ICON" --out "$APP_DST/AppIcon60x60@3x.png" >/dev/null 2>&1
              sips -z  76  76 "$SRC_ICON" --out "$APP_DST/AppIcon76x76~ipad.png" >/dev/null 2>&1
              sips -z 152 152 "$SRC_ICON" --out "$APP_DST/AppIcon76x76@2x~ipad.png" >/dev/null 2>&1
              echo "  AppIcon60x60@2x.png AppIcon60x60@3x.png"
            fi
          fi

          echo ""
          echo "========== 第3步: ldid 注入 entitlements =========="
          ENT="TrollAutoTouch/TrollAutoTouch.entitlements"
          echo "[*] Entitlements 文件内容:"
          cat "$ENT"
          echo ""
          echo "[*] 执行: ldid -S$ENT $BIN"
          ldid -S"$ENT" "$BIN"
          LDI_EXIT=$?
          echo "[*] ldid 退出码: $LDI_EXIT"

          echo ""
          echo "========== 第4步: 验证注入结果 =========="
          echo "[*] ldid -e 输出 (全部):"
          ldid -e "$BIN" 2>&1 || echo "[!] ldid -e 失败!"
          echo ""
          echo "[*] 再次检查二进制签名:"
          codesign -d -v "$BIN" 2>&1 || echo "  (无签名)"

          echo ""
          echo "========== 第5步: 最终 .app 内容 =========="
          echo "[*] 根目录 PNG 文件:"
          ls -la "$APP_DST/"*.png 2>/dev/null || echo "  (无 PNG 文件!)"
          echo ""
          echo "[*] 根目录所有 .png:"
          find "$APP_DST" -maxdepth 1 -name "*.png" -exec basename {} \;

          echo ""
          echo "========== 打包 IPA =========="
          cd build && zip -qry TrollAutoTouch.ipa Payload
          echo "[OK] build/TrollAutoTouch.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollAutoTouch
          path: build/TrollAutoTouch.ipa
          if-no-files-found: error
