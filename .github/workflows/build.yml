name: Build TrollAutoTouch IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write   # 允许在构建失败时把 xcodebuild 日志推送到 ci-debug 分支
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install xcodegen
          # 用 Procursus ldid（v2.1.5-procursus7）替换 Homebrew 老版 ldid。
          # Homebrew 的 ldid 是 xerub 老版本，不支持 Xcode 16 编译产物默认的
          # chained fixups 格式（arm64），会导致 ldid -S 静默失败（返回 0 但
          # 实际没写入 entitlements，ldid -e 输出空 <dict/>）。
          ARCH=$(uname -m)
          echo "[*] runner 架构: $ARCH"
          curl -sL "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_${ARCH}" -o /tmp/ldid
          chmod +x /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid
          echo "[OK] ldid 安装完成: $(which ldid)"
          ldid -V 2>&1 | head -3 || true

      - name: Sync root main.lua into bundle lua dir
        run: |
          set -e
          SRC="$PWD/main.lua"
          DST="$PWD/TrollAutoTouch/Resources/lua/Main.lua"
          [ -f "$SRC" ] || { echo "[x] 根目录 main.lua 不存在: $SRC"; exit 1; }
          cp "$SRC" "$DST"
          echo "[OK] main.lua 已同步: 根目录 → Resources/lua/Main.lua ($(wc -c < "$DST") bytes)"

      - name: Generate Xcode project
        run: |
          rm -rf TrollAutoTouch.xcodeproj
          # 先 dump 校验 spec，报错信息写入 step summary（无需登录即可查看）
          if ! xcodegen dump > /tmp/xcodegen_dump.log 2>&1; then
            mkdir -p build/logs; cp /tmp/xcodegen_dump.log build/logs/ 2>/dev/null || true
            {
              git config user.name "ci-bot"
              git config user.email "ci-bot@users.noreply.github.com"
              cp /tmp/xcodegen_dump.log ./ci-error.log
              git checkout -b ci-debug 2>/dev/null || git checkout ci-debug
              git add -f ci-error.log
              git commit -m "ci: save xcodegen dump log (run $GITHUB_RUN_ID)" --allow-empty >/dev/null 2>&1
              git push origin ci-debug --force
            } >/dev/null 2>&1 && echo "[i] xcodegen dump 日志已推送到 ci-debug 分支" || echo "[i] 日志推送失败(忽略)"
            echo "## xcodegen spec 解析失败" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -60 /tmp/xcodegen_dump.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! xcodegen generate 2>&1 | tee /tmp/xcodegen.log; then
            mkdir -p build/logs; cp /tmp/xcodegen.log build/logs/ 2>/dev/null || true
            {
              git config user.name "ci-bot"
              git config user.email "ci-bot@users.noreply.github.com"
              cp /tmp/xcodegen.log ./ci-error.log
              git checkout -b ci-debug 2>/dev/null || git checkout ci-debug
              git add -f ci-error.log
              git commit -m "ci: save xcodegen log (run $GITHUB_RUN_ID)" --allow-empty >/dev/null 2>&1
              git push origin ci-debug --force
            } >/dev/null 2>&1 && echo "[i] xcodegen 日志已推送到 ci-debug 分支" || echo "[i] 日志推送失败(忽略)"
            echo "## xcodegen generate 失败" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -60 /tmp/xcodegen.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Build
        run: |
          set -e
          # 补齐 Assets.xcassets 缺失的 PNG（App Switcher 顶部图标走 Assets.car，
          # 需要 40x40/29x29 尺寸）
          SRC="$PWD/TrollAutoTouch_icon.png"
          ICONSET="$PWD/TrollAutoTouch/Assets.xcassets/AppIcon.appiconset"
          echo "[*] 补齐 iconset PNG..."
          [ -f "$ICONSET/AppIcon40x40@2x.png" ] || sips -z 80 80 "$SRC" --out "$ICONSET/AppIcon40x40@2x.png" >/dev/null
          [ -f "$ICONSET/AppIcon40x40@3x.png" ] || sips -z 120 120 "$SRC" --out "$ICONSET/AppIcon40x40@3x.png" >/dev/null
          [ -f "$ICONSET/AppIcon29x29@2x.png" ] || sips -z 58 58 "$SRC" --out "$ICONSET/AppIcon29x29@2x.png" >/dev/null
          [ -f "$ICONSET/AppIcon29x29@3x.png" ] || sips -z 87 87 "$SRC" --out "$ICONSET/AppIcon29x29@3x.png" >/dev/null
          echo "[OK] iconset PNG 就绪"
          # 打印关键构建设置，便于诊断（如 HEADER_SEARCH_PATHS 未生效时快速发现）
          echo "[*] 关键构建设置:"
          xcodebuild -project TrollAutoTouch.xcodeproj -scheme TrollAutoTouch \
            -configuration Release -sdk iphoneos -showBuildSettings 2>/dev/null \
            | grep -E "HEADER_SEARCH_PATHS|GCC_C_LANGUAGE_STANDARD" || echo "  (未找到设置!)"
          mkdir -p build
          # ENABLE_CHAINED_FIXUPS=NO + -Wl,-no_fixup_chains(已写入 project.yml):
          # 禁用 chained fixups，兼容 Procursus ldid / TrollStore。
          # 警告: 不能在这里传 OTHER_LDFLAGS，命令行会整体覆盖 project.yml 中的
          #       框架链接参数（-framework UIKit ...），导致链接失败！
          # ARCHS="arm64 arm64e" + ONLY_ACTIVE_ARCH=NO: app 必须编译为 universal!
          # app 自身直接注入 SpringBoard (task_for_pid + thread_create_running(dlopen)),
          # 在 A12+ arm64e 设备上 app 必须以 arm64e 模式运行, 否则本进程的 dlopen 地址
          # (arm64 共享缓存) ≠ SpringBoard 的 dlopen (arm64e 共享缓存), 注入会崩溃。
          # 日志写入文件，失败时打印完整日志并立即退出（不再被管道吞掉退出码）。
          if ! xcodebuild -project TrollAutoTouch.xcodeproj \
            -scheme TrollAutoTouch \
            -configuration Release \
            -sdk iphoneos \
            ARCHS="arm64 arm64e" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            STRIP_INSTALLED_PRODUCT=NO \
            DEAD_CODE_STRIPPING=NO \
            ENABLE_CHAINED_FIXUPS=NO \
            -derivedDataPath build/DerivedData \
            build > /tmp/xcodebuild.log 2>&1; then
            echo "[x] xcodebuild 编译失败，完整日志:"
            tail -80 /tmp/xcodebuild.log
            # 写入 step summary，无需登录即可在 Actions 页面看到错误明细
            {
              echo "## xcodebuild 失败详情"
              echo ""
              echo '```'
              grep -nE "error:|warning:|note:|fatal|file not found|duplicate symbol|Undefined symbols|ld: |clang:" /tmp/xcodebuild.log | tail -60
              echo ""
              echo "--- 日志尾部 ---"
              tail -120 /tmp/xcodebuild.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # 把完整日志推送到 ci-debug 分支，便于在仓库里直接读取（不触发 CI）
            {
              git config user.name "ci-bot"
              git config user.email "ci-bot@users.noreply.github.com"
              cp /tmp/xcodebuild.log ./ci-error.log
              git checkout -b ci-debug 2>/dev/null || git checkout ci-debug
              git add -f ci-error.log
              git commit -m "ci: save xcodebuild log (run $GITHUB_RUN_ID)" --allow-empty >/dev/null 2>&1
              git push origin ci-debug --force
            } >/dev/null 2>&1 && echo "[i] 完整日志已推送到 ci-debug 分支" || echo "[i] 日志推送失败(忽略)"
            exit 1
          fi
          tail -5 /tmp/xcodebuild.log
          echo "[OK] xcodebuild 编译成功"

          # 验证 app 主二进制架构 (必须同时包含 arm64 + arm64e, 否则直接注入 SpringBoard 会失败)
          APP_BIN="build/DerivedData/Build/Products/Release-iphoneos/TrollAutoTouch.app/TrollAutoTouch"
          if [ -f "$APP_BIN" ]; then
            echo "[*] app 主二进制架构:"
            lipo -info "$APP_BIN"
            if lipo -info "$APP_BIN" 2>/dev/null | grep -q "arm64e"; then
              echo "[OK] app 包含 arm64e slice (直接注入可用)"
            else
              echo "[!] 警告: app 不包含 arm64e slice! 在 A12+ 设备上直接注入 SpringBoard 会失败"
            fi
          fi

          # ── 编译触摸服务 dylib (TSInjectedTouchService, 注入 SpringBoard 用) ──
          # 注意: -target 构建不能搭配 -derivedDataPath (xcodebuild 限制,
          # 该 flag 仅与 -scheme/-xctestrun 搭配), 否则报错:
          #   "The flag -scheme, -testProductsPath, or -xctestrun is required
          #    when specifying -derivedDataPath."
          # 所以用 CONFIGURATION_BUILD_DIR 显式指定 dylib 输出目录。
          # 架构必须为 universal (arm64 + arm64e)!
          # SpringBoard 在 A12+ (arm64e) 设备上是 arm64e 进程,
          # 只有 arm64 的 dylib 无法被 dlopen, 触摸服务永远不会启动。
          # 注意: ONLY_ACTIVE_ARCH 必须为 NO 才会把 ARCHS 里的两个架构都编出来。
          if ! xcodebuild -project TrollAutoTouch.xcodeproj \
            -target TSInjectedTouchService \
            -configuration Release \
            -sdk iphoneos \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 arm64e" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_CHAINED_FIXUPS=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build/dylib" \
            build > /tmp/dylib_build.log 2>&1; then
            echo "[x] dylib 编译失败，完整日志:"
            tail -80 /tmp/dylib_build.log
            {
              echo "## dylib 编译失败详情"
              echo ""
              echo '```'
              grep -nE "error:|undefined|ld: |clang:|file not found" /tmp/dylib_build.log | tail -60
              echo ""
              echo "--- 日志尾部 ---"
              tail -100 /tmp/dylib_build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # 把 dylib 编译日志推送到 ci-debug 分支（便于在仓库里直接读取）
            {
              git config user.name "ci-bot"
              git config user.email "ci-bot@users.noreply.github.com"
              cp /tmp/dylib_build.log ./ci-error.log
              git checkout -b ci-debug 2>/dev/null || git checkout ci-debug
              git add -f ci-error.log
              git commit -m "ci: save dylib build log (run $GITHUB_RUN_ID)" --allow-empty >/dev/null 2>&1
              git push origin ci-debug --force
            } >/dev/null 2>&1 && echo "[i] dylib 日志已推送到 ci-debug 分支" || echo "[i] dylib 日志推送失败(忽略)"
            exit 1
          fi
          tail -3 /tmp/dylib_build.log
          echo "[OK] TSInjectedTouchService.dylib 编译成功"
          echo "[*] dylib 架构 (必须同时包含 arm64 与 arm64e):"
          lipo -info "$PWD/build/dylib/TSInjectedTouchService.dylib"

          # ── 编译 HUD 服务 (HUDServices, 全局弹窗用) ──
          # 独立隐藏 app: 运行时由主 App 安装并启动, 在任意前台 app 之上弹对话框。
          # 同样用 -target + CONFIGURATION_BUILD_DIR (不能搭配 -derivedDataPath)。
          if ! xcodebuild -project TrollAutoTouch.xcodeproj \
            -target HUDServices \
            -configuration Release \
            -sdk iphoneos \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 arm64e" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_CHAINED_FIXUPS=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build/hud" \
            build > /tmp/hud_build.log 2>&1; then
            echo "[x] HUD 服务编译失败，完整日志:"
            tail -80 /tmp/hud_build.log
            {
              echo "## HUDServices 编译失败详情"
              echo ""
              echo '```'
              grep -nE "error:|undefined|ld: |clang:|file not found" /tmp/hud_build.log | tail -60
              echo ""
              echo "--- 日志尾部 ---"
              tail -100 /tmp/hud_build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            {
              git config user.name "ci-bot"
              git config user.email "ci-bot@users.noreply.github.com"
              cp /tmp/hud_build.log ./ci-error.log
              git checkout -b ci-debug 2>/dev/null || git checkout ci-debug
              git add -f ci-error.log
              git commit -m "ci: save hud build log (run $GITHUB_RUN_ID)" --allow-empty >/dev/null 2>&1
              git push origin ci-debug --force
            } >/dev/null 2>&1 && echo "[i] HUD 日志已推送到 ci-debug 分支" || echo "[i] HUD 日志推送失败(忽略)"
            exit 1
          fi
          tail -3 /tmp/hud_build.log
          echo "[OK] HUDServices.app 编译成功"
          lipo -info "$PWD/build/hud/HUDServices.app/HUDServices" 2>/dev/null || true

      - name: Package IPA
        run: |
          set -e
          APP=$(find build/DerivedData -name 'TrollAutoTouch.app' -type d | head -1)
          [ -z "$APP" ] && echo "[-] .app not found" && exit 1
          echo "[*] .app: $APP"

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          APP_DST="build/Payload/TrollAutoTouch.app"
          BIN="$APP_DST/TrollAutoTouch"
          ENT="$PWD/TrollAutoTouch/TrollAutoTouch.entitlements"

          # 防御: 主二进制必须存在，否则说明 xcodebuild 产物不完整
          if [ ! -f "$BIN" ]; then
            echo "[x] 主二进制不存在: $BIN"
            echo "[*] .app 目录内容:"
            ls -la "$APP_DST" 2>/dev/null || echo "    (.app 目录都不存在!)"
            echo "[*] 请查看 Build 步骤日志确认编译是否成功"
            exit 1
          fi

          echo ""
          echo "=== 触摸服务 (injected touch) ==="
          # 注入式触摸: TSInjectedTouchService.dylib (注入 SpringBoard 的触摸服务)
          # + opainject (OpenInject 注入器)。app 运行时把它们部署到 Documents 后:
          #   opainject <SpringBoard_pid> <dylib>  → 注入 → socket 发触摸
          mkdir -p "$APP_DST/bin"
          DYLIB=$(find build/DerivedData build/dylib -name 'TSInjectedTouchService.dylib' -type f 2>/dev/null | head -1)
          if [ -n "$DYLIB" ]; then
            cp "$DYLIB" "$APP_DST/bin/TSInjectedTouchService.dylib"
            # dylib 必须带 platform-application 签名: SpringBoard 是 platform 二进制
            # (CS_PLATFORM_BINARY), iOS 15+ 要求注入的 dylib 同样带 platform-application,
            # 否则 SpringBoard dlopen 会被 dyld 拒绝 (library validation), opainject 可能
            # 显示注入成功但 dylib 实际未加载。injector.entitlements.xml 含
            # platform-application + no-sandbox, 满足 SpringBoard 加载要求。
            if ldid -S"$PWD/TrollAutoTouch/Resources/injector.entitlements.xml" "$APP_DST/bin/TSInjectedTouchService.dylib" 2>/dev/null; then
              echo "[OK] TSInjectedTouchService.dylib 已签名 (platform-application)"
            else
              echo "[!] dylib 签名失败 (SpringBoard 可能拒绝 dlopen)"
            fi
            echo "[OK] TSInjectedTouchService.dylib ($(stat -f%z "$APP_DST/bin/TSInjectedTouchService.dylib") bytes)"
          else
            echo "[x] 未找到 TSInjectedTouchService.dylib, 触摸注入不可用"
            exit 1
          fi
          cp "$PWD/TrollAutoTouch/Resources/bin/opainject" "$APP_DST/bin/opainject"
          chmod 755 "$APP_DST/bin/opainject"
          # opainject 重签: 补上 no-sandbox + springboard.debugapplications。
          # 实测 opainject 被 app spawn 后以 mobile(501) 运行, 若二进制自身缺 no-sandbox,
          # 子进程会继承 app 沙箱 → sandbox 拦截 task_for_pid(SpringBoard) → opainject
          # 报 "ERROR: Got invalid task port (-1)" (task_for_pid 返回 dead name)。
          # 原版可用的注入器 luaLib 自带 no-sandbox + debugapplications, 这里对齐该权限集。
          # 签名用 Procursus ldid (v2.1.5-procursus7), 支持 arm64e 重签 + --platform-apply
          # (codesign 不支持 --platform-apply; xerub 老版 ldid 重签才破坏 arm64e slice)。
          # --platform-apply: 让 CodeDirectory 带上 CS_PLATFORM_BINARY, 使 opainject 进程
          # 成为 platform 进程(与 platform-application 权限配合), 兜底应对 task_for_pid
          # 对 platform 目标进程(SpringBoard)的平台进程检查。
          # 注意: 不能用 ent2.xml(仅 5 个 key, 会剥离 system-task-ports 等关键权限)。
          OP_ENT="$PWD/TrollAutoTouch/Resources/opainject.entitlements.xml"
          if ldid -S"$OP_ENT" --platform-apply "$APP_DST/bin/opainject" 2>/tmp/op_sign.log; then
            echo "[OK] opainject 已重签 (no-sandbox + debugapplications + platform-apply)"
          elif codesign --force --sign - --entitlements "$OP_ENT" "$APP_DST/bin/opainject" 2>>/tmp/op_sign.log; then
            echo "[OK] opainject 已重签 (no-sandbox + debugapplications, 无 platform-apply)"
          else
            echo "[!] opainject 重签失败, 保留原版签名 (task_for_pid 可能仍会失败):"
            echo "    $(cat /tmp/op_sign.log)"
          fi
          echo "[*] opainject 提取 entitlements (验证):"
          codesign -d --entitlements - "$APP_DST/bin/opainject" 2>/dev/null | grep -E "no-sandbox|debugapplications|platform-application|system-task-ports|task_for_pid|thread-set-state" || echo "    (提取失败/为空!)"
          cp "$OP_ENT" "$APP_DST/bin/opainject.entitlements.xml"
          # 运行时重签工具链 (学原版 bin/): 部署 ldid + ent2.xml + injector.entitlements.xml,
          # app 在注入前可再次重签 opainject/dylib, 兜底应对 TrollStore 重签剥离权限。
          for T in ldid fastPathSign; do
            if [ -f "$PWD/TrollAutoTouch/Resources/bin/$T" ]; then
              cp "$PWD/TrollAutoTouch/Resources/bin/$T" "$APP_DST/bin/$T"
              chmod 755 "$APP_DST/bin/$T"
              echo "[OK] 已部署运行时工具 $T"
            fi
          done
          cp "$PWD/TrollAutoTouch/Resources/bin/ent2.xml" "$APP_DST/bin/ent2.xml" 2>/dev/null || true
          cp "$PWD/TrollAutoTouch/Resources/injector.entitlements.xml" "$APP_DST/bin/injector.entitlements.xml" 2>/dev/null || true
          echo "[OK] bin/ 内容:"
          ls -la "$APP_DST/bin"

          echo ""
          echo "=== HUD 服务 (全局弹窗) ==="
          # 独立隐藏 app: 随主包分发到 HUD/HUDServices.app, 运行时由主 App
          # 复制出来并用 MobileInstallation 安装, 然后通过 CPDistributedMessagingCenter
          # 请求它在任意前台 app 之上弹系统对话框 (sys.alert / sys.alertButtons 全局版)。
          HUD_SRC="$PWD/build/hud/HUDServices.app"
          HUD_DST="$APP_DST/HUD/HUDServices.app"
          HUD_ENT="$PWD/HUDServices/HUDServices.entitlements"
          if [ ! -d "$HUD_SRC" ]; then
            echo "[x] 未找到 HUDServices.app ($HUD_SRC), 全局弹窗不可用"
            exit 1
          fi
          rm -rf "$APP_DST/HUD"
          mkdir -p "$APP_DST/HUD"
          cp -R "$HUD_SRC" "$HUD_DST"
          HUD_BIN="$HUD_DST/HUDServices"
          echo "[*] HUD 二进制: $HUD_BIN"
          lipo -info "$HUD_BIN" || true
          # 注入 HUD entitlements: platform-application + no-sandbox + 前台激活权限,
          # 使 HUD 被 MobileInstallation 安装后拥有激活自己/交还前台的权限。
          if [ -f "$HUD_ENT" ] && ldid -S"$HUD_ENT" --platform-apply "$HUD_BIN" 2>/tmp/hud_sign.log; then
            echo "[OK] HUD 已注入 entitlements + platform-apply"
          elif ldid -S"$HUD_ENT" "$HUD_BIN" 2>/tmp/hud_sign.log; then
            echo "[OK] HUD 已注入 entitlements"
          else
            echo "[!] HUD entitlements 注入失败, 全局弹窗可能不可用:"
            echo "    $(cat /tmp/hud_sign.log)"
          fi
          HUD_ENT_EXTRACTED=$(ldid -e "$HUD_BIN" 2>/dev/null || true)
          if echo "$HUD_ENT_EXTRACTED" | grep -q "platform-application"; then
            echo "[OK] HUD entitlements 验证通过 (platform-application)"
            HUD_ENT_STATUS="OK"
          else
            echo "[!] 警告: HUD entitlements 验证失败"
            HUD_ENT_STATUS="FAILED"
          fi
          echo "[OK] HUD 服务已嵌入: $HUD_DST"
          ls -la "$HUD_DST"
          HUD_ARCHS=$(lipo -info "$HUD_BIN" 2>/dev/null | sed 's/^[^:]*: //' || echo "未知")
          HUD_SIZE=$(stat -f%z "$HUD_BIN" 2>/dev/null || stat -c%s "$HUD_BIN" 2>/dev/null || echo "?")
          {
            echo ""
            echo "### HUD 服务 (全局弹窗) 构建结果"
            echo ""
            echo "- 二进制: \`Payload/TrollAutoTouch.app/HUD/HUDServices.app/HUDServices\`"
            echo "- 大小: $HUD_SIZE bytes"
            echo "- 架构: \`$HUD_ARCHS\`"
            echo "- entitlements 注入 + platform-apply: \`$HUD_ENT_STATUS\`"
            echo "- 关键 entitlement: \`platform-application\` / \`no-sandbox\` / \`frontboard.launchapplications\` / \`springboard.activate\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "=== 架构 ==="
          lipo -info "$BIN"
          file "$BIN"

          echo ""
          echo "=== 清理旧签名 ==="
          rm -rf "$APP_DST/_CodeSignature"
          codesign --remove-signature "$BIN" 2>/dev/null && echo "[OK] 签名已移除" || echo "[*] 二进制无签名"

          echo ""
          echo "=== 图标 ==="
          rm -f "$APP_DST/AppIcon.png" "$APP_DST/icon-1024.ico"
          ICONSET="$PWD/TrollAutoTouch/Assets.xcassets/AppIcon.appiconset"
          ls "$ICONSET"/*.png 1>/dev/null 2>&1 && cp "$ICONSET"/*.png "$APP_DST/" && echo "[OK]" || echo "[!] no icons"

          echo ""
          echo "=== 注入 entitlements ==="
          echo "[*] ldid 版本: $(ldid -V 2>&1 | head -1 || echo unknown)"
          echo "[*] entitlements 文件: $ENT"

          # 1) 防御: CI 上 checkout 出来的 entitlements 文件曾多次被破坏
          #    (内容变为 181 字节的空 dict plist, 注入后验证为 0 键)。
          #    因此不从工作区文件读取, 而是直接从 git 对象库强制恢复原始字节,
          #    完全绕过 checkout/文件系统可能引入的任何问题。
          echo "[*] checkout 后 $ENT 大小: $(wc -c < "$ENT" 2>/dev/null || echo 缺失)"
          shasum -a 256 "$ENT" 2>/dev/null || true
          git show HEAD:TrollAutoTouch/TrollAutoTouch.entitlements > /tmp/ent.xml 2>/tmp/gitshow.log || { echo "[x] git show 恢复失败:"; cat /tmp/gitshow.log; exit 1; }
          echo "[*] git 对象恢复大小: $(wc -c < /tmp/ent.xml) bytes"
          plutil -lint /tmp/ent.xml >/dev/null || { echo "[x] git 中的 entitlements 非法, 停止打包"; exit 1; }
          echo "[OK] entitlements 已从 git 对象恢复并通过 plutil 校验"

          # 2) 诊断: 二进制是否带 chained fixups load command
          echo "[*] 二进制签名结构:"
          otool -l "$BIN" 2>/dev/null | grep -E "LC_CODE_SIGNATURE|LC_DYLD_CHAINED_FIXUPS|LC_DYLD_INFO" || echo "    (无相关 load command)"

          # 3) 注入: 优先 Procursus ldid (v2.1.5-procursus7) --platform-apply。
          #    codesign 不支持 --platform-apply (实测报 unrecognized option), 无法用 codesign
          #    打 CS_PLATFORM_BINARY; 而 Procursus ldid 支持该选项且能正确重签 arm64e slice
          #    (xerub 老版 ldid 才破坏 arm64e → EBADEXEC)。chained fixups 已在 project.yml
          #    禁用 (-Wl,-no_fixup_chains), ldid 可正常解析。
          #    --platform-apply: 给 CodeDirectory 打上 CS_PLATFORM_BINARY, 使 app 进程成为
          #    platform 进程 (与 opainject 对齐)。iOS 15+ 上 task_for_pid 对 platform 目标
          #    (SpringBoard) 有平台进程检查: 非 platform 调用者会拿到 dead/null task port,
          #    后续 mach_vm_allocate 报 MACH_SEND_INVALID_DEST (kr=0x10000003), 直接注入必败。
          if ldid -S/tmp/ent.xml --platform-apply "$BIN" 2>/tmp/ldid_sign.log; then
            echo "[OK] ldid 注入成功 (entitlements + platform-apply)"
            SIGN_TOOL=ldid
          else
            echo "[!] ldid 失败, 回退 codesign (无 platform-apply):"
            echo "    $(cat /tmp/ldid_sign.log)"
            codesign --force --sign - --entitlements /tmp/ent.xml "$BIN" 2>&1 || { echo "[x] codesign 注入失败, 停止打包"; exit 1; }
            echo "[OK] codesign 注入成功 (adhoc, 无 platform-apply)"
            SIGN_TOOL=codesign
          fi

          echo ""
          echo "=== 验证注入结果 ==="
          # codesign 优先提取 (支持 DER), ldid -e 兜底
          if [ "$SIGN_TOOL" = "codesign" ]; then
            EXTRACTED=$(codesign -d --entitlements - "$BIN" 2>/dev/null || ldid -e "$BIN" 2>/dev/null || true)
          else
            EXTRACTED=$(ldid -e "$BIN" 2>/dev/null || codesign -d --entitlements - "$BIN" 2>/dev/null || true)
          fi
          echo "$EXTRACTED" > /tmp/ent_check.xml
          echo "[*] 注入工具: ${SIGN_TOOL}, 提取 entitlements: $(wc -c < /tmp/ent_check.xml) bytes"
          MISSING=0
          for KEY in "com.apple.private.security.no-sandbox" "platform-application" "com.apple.private.tcc.allow" "keychain-access-groups" "com.apple.private.security.container-manager" "task_for_pid-allow" "com.apple.system-task-ports"; do
            if grep -q "$KEY" /tmp/ent_check.xml; then
              echo "[OK] $KEY"
            else
              echo "[x] 缺少: $KEY"
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then
            echo ""
            echo "[x] entitlements 注入验证失败, 停止打包"
            echo "[debug] 提取的 entitlements 前 60 行:"
            head -60 /tmp/ent_check.xml
            echo "[debug] codesign 完整校验:"
            codesign --verify --deep --strict "$APP_DST" 2>&1 || true
            exit 1
          fi
          echo "[OK] entitlements 注入验证通过 (no-sandbox / platform-application / TCC / keychain / container / task_for_pid / system-task-ports 全部就位)"

          echo ""
          echo "=== 验证 CS_PLATFORM_BINARY (platform 身份) ==="
          CS_FLAGS=$(codesign -dvvv "$BIN" 2>&1 | grep -i "flags=" | head -1)
          echo "[*] app CodeDirectory flags: ${CS_FLAGS:-未知}"
          if echo "$CS_FLAGS" | grep -qi "platform"; then
            echo "[OK] app 已带 CS_PLATFORM_BINARY, 进程将是 platform 身份"
          else
            echo "[!] 警告: 未检测到 CS_PLATFORM_BINARY, task_for_pid(SpringBoard) 可能仍会失败"
            echo "    (ldid --platform-apply 未生效? 检查上方 ldid 签名输出)"
          fi
          OP_FLAGS=$(codesign -dvvv "$APP_DST/bin/opainject" 2>&1 | grep -i "flags=" | head -1)
          echo "[*] opainject CodeDirectory flags: ${OP_FLAGS:-未知}"
          if echo "$OP_FLAGS" | grep -qi "platform"; then
            echo "[OK] opainject 已带 CS_PLATFORM_BINARY"
          else
            echo "[!] 警告: opainject 未检测到 CS_PLATFORM_BINARY"
          fi

          echo ""
          echo "=== Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles" "$APP_DST/Info.plist" 2>/dev/null || echo "(无 CFBundleIcons)"

          echo ""
          echo "=== .app PNG ==="
          find "$APP_DST" -maxdepth 1 -name "*.png" | while read f; do echo "  $(basename $f) ($(stat -f%z "$f") bytes)"; done

          echo ""
          echo "=== 打包 ==="
          cd build && zip -qry TrollAutoTouch.ipa Payload
          echo "[OK] build/TrollAutoTouch.ipa"

          # ── IPA 内容自检 ──
          # artifact 下载需要 GitHub 认证, 无法直接验证; 因此把 IPA 内文件清单
          # 推送到 ci-debug 分支的 ci-ipa-contents.txt, 匿名即可读取验证
          # (确认 bin/TSInjectedTouchService.dylib 与 bin/opainject 确实在包里)。
          echo ""
          echo "=== IPA 内容清单 ==="
          unzip -l TrollAutoTouch.ipa | tee /tmp/ipa_contents.txt
          echo ""
          echo "=== 关键文件检查 ==="
          MISSING_IPA=0
          for KEY in "Payload/TrollAutoTouch.app/TrollAutoTouch" "Payload/TrollAutoTouch.app/bin/TSInjectedTouchService.dylib" "Payload/TrollAutoTouch.app/bin/opainject" "Payload/TrollAutoTouch.app/HUD/HUDServices.app/HUDServices"; do
            if grep -q "$KEY" /tmp/ipa_contents.txt; then
              echo "[OK] $KEY"
            else
              echo "[x] IPA 缺少: $KEY"
              MISSING_IPA=1
            fi
          done
          if [ "$MISSING_IPA" = "1" ]; then
            echo "[x] IPA 内容不完整, 停止"
            exit 1
          fi
          {
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            cp /tmp/ipa_contents.txt ./ci-ipa-contents.txt
            git checkout -b ci-debug 2>/dev/null || git checkout ci-debug
            git add -f ci-ipa-contents.txt
            git commit -m "ci: save ipa contents (run $GITHUB_RUN_ID)" --allow-empty >/dev/null 2>&1
            git push origin ci-debug --force
          } >/dev/null 2>&1 && echo "[i] IPA 清单已推送到 ci-debug 分支" || echo "[i] IPA 清单推送失败(忽略)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollAutoTouch
          path: build/TrollAutoTouch.ipa
          if-no-files-found: error

      - name: Upload diagnostic logs (any outcome)
        if: always()
        run: |
          mkdir -p build/logs
          for f in /tmp/xcodegen_dump.log /tmp/xcodegen.log /tmp/xcodebuild.log /tmp/dylib_build.log /tmp/codesign.log /tmp/ent_check.xml; do
            [ -f "$f" ] && cp "$f" build/logs/
          done
          echo "logs:"; ls -la build/logs 2>/dev/null || echo "  (no logs)"

      - name: Upload diagnostic logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: build/logs
          if-no-files-found: ignore
