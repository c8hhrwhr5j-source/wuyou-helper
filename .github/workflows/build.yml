name: Build TrollAutoTouch IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: |
          rm -rf TrollAutoTouch.xcodeproj
          xcodegen generate

      - name: Build
        run: |
          mkdir -p build
          set +e
          xcodebuild -project TrollAutoTouch.xcodeproj \
            -scheme TrollAutoTouch \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build/DerivedData \
            build > build/build.log 2>&1
          BUILD_EXIT=$?
          cat build/build.log
          exit $BUILD_EXIT

      - name: Package IPA
        run: |
          APP=$(find build/DerivedData -name 'TrollAutoTouch.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "[-] TrollAutoTouch.app not found"
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          APP_DST="build/Payload/TrollAutoTouch.app"

          echo "[*] 拷贝 App 图标 PNG 到 .app 根目录 (TrollStore 需要) ..."
          ICONSET="TrollAutoTouch/Assets.xcassets/AppIcon.appiconset"
          if ls "$ICONSET"/*.png 1>/dev/null 2>&1; then
            cp "$ICONSET"/*.png "$APP_DST/"
            echo "  $(ls "$ICONSET"/*.png | tr '\n' ' ')"
          else
            echo "  [!] 未找到图标 PNG，用 sips 生成..."
            SRC_ICON="TrollAutoTouch_icon.png"
            if [ -f "$SRC_ICON" ]; then
              sips -z 120 120 "$SRC_ICON" --out "$APP_DST/AppIcon60x60@2x.png" >/dev/null 2>&1
              sips -z 180 180 "$SRC_ICON" --out "$APP_DST/AppIcon60x60@3x.png" >/dev/null 2>&1
              echo "  AppIcon60x60@2x.png AppIcon60x60@3x.png"
            fi
          fi

          echo "[*] 注入 entitlements (ldid) ..."
          ldid -S"TrollAutoTouch/TrollAutoTouch.entitlements" "$APP_DST/TrollAutoTouch"

          echo "[*] 验证 ldid 注入结果 ..."
          ldid -e "$APP_DST/TrollAutoTouch" | head -20
          echo "  ... (验证 no-sandbox 是否注入)"

          cd build && zip -qry TrollAutoTouch.ipa Payload
          echo "[OK] build/TrollAutoTouch.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollAutoTouch
          path: build/TrollAutoTouch.ipa
          if-no-files-found: error
